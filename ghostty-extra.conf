# Terminal translucency for omatrix.
#
# It lives here and not in ghostty.conf because Omarchy generates that file from
# a template on every `theme set` -- anything written there is overwritten.
# ghostty-extra.conf has no template, and the default ~/.config/ghostty/config
# already pulls it in from the staged theme.
#
# This is the TERMINAL's opacity, not Hyprland's window opacity. Ghostty makes
# only the background translucent and leaves glyphs fully opaque; a Hyprland
# window rule fades the text with it and throws away the contrast the palette is
# defending.
#
# 0.80 is not a taste call. Composited over the worst possible backdrop, the
# dimmest text is what runs out of contrast first, so the alpha and those two
# colours were solved together rather than one after the other:
#
#   foreground      #b0fa9e   9.14:1
#   accent          #89f76e   8.37:1
#   dark_foreground #61c249   5.01:1   moved up the ramp; #4aa434 gave 3.57
#   muted           #3d9926   3.11:1   AA-large, the right bar for comments
#
# At the original #4aa434 this alpha would have been 0.87. Moving one colour up
# the film's own ramp bought the difference, and cost nothing: at 0.90 that
# colour read 5.04:1, and it reads 5.01:1 here.
#
# 0.75 is the hard floor. Below it muted drops under 3:1 and stops being dim
# text, it just becomes unreadable.
background-opacity = 0.80
