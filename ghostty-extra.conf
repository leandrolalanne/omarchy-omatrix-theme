# Terminal translucency for omatrix.
#
# It lives here and not in ghostty.conf because Omarchy generates that file from
# a template on every `theme set` -- anything written there is overwritten.
# ghostty-extra.conf has no template, and the default ~/.config/ghostty/config
# already pulls it in from the staged theme.
#
# This is the TERMINAL's opacity, not Hyprland's window opacity. Ghostty makes
# only the background translucent and leaves glyphs fully opaque; a Hyprland
# window rule fades the text with it and throws away the contrast the palette is
# defending.
#
# 0.90 is not a taste call. Composited over the worst possible backdrop, the
# binding colour is dark_foreground #4aa434, which needs alpha 0.87 to hold
# 4.5:1. At 0.90 it reads 5.04:1 and the body foreground 12.89:1. Going lower
# starts eating the dimmest text first, which is the text that was already
# closest to the floor.
#
# muted #34861f never reaches 4.5:1, at any alpha, by design: it is for
# comments and inactive state, where AA-large is the right bar.
background-opacity = 0.90
