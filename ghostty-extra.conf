# Terminal translucency for omatrix.
#
# It lives here and not in ghostty.conf because Omarchy generates that file from
# a template on every `theme set` -- anything written there is overwritten.
# ghostty-extra.conf has no template, and the default ~/.config/ghostty/config
# already pulls it in from the staged theme.
#
# This is the TERMINAL's opacity, not Hyprland's window opacity. Ghostty makes
# only the background translucent and leaves glyphs fully opaque; a Hyprland
# window rule fades the text with it and throws away the contrast the palette is
# defending.
#
# 0.90 is not a taste call. Composited over the worst possible backdrop:
#
#   foreground      #b0fa9e   12.89:1
#   accent          #89f76e   11.81:1
#   dark_foreground #61c249    7.06:1
#   muted           #3d9926    4.38:1   AA-large, the right bar for comments
#
# Those last two sit further up the film's ramp than the rain's own stops. They
# were moved there while this was 0.80, where they fell to 3.57:1 and 2.46:1 --
# unreadable rather than dim. At 0.90 they are simply comfortable, so they stay.
#
# 0.75 is the hard floor whatever else is adjusted: below it muted drops under
# 3:1. There is no blur under this; see hyprland.lua for why.
background-opacity = 0.90
